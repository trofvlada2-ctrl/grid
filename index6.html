<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Grid Layout Tasks</title>
    <link rel="stylesheet" href="style6.css" />
  </head>
  <body>
    <section id="features">
      <h2>Features</h2>
      <div class="features-grid">
        <div class="card">Feature 1</div>
        <div class="card">Feature 2</div>
        <div class="card">Feature 3</div>
      </div>
    </section>

    <section id="courses">
      <h2>Courses</h2>
      <div class="courses-grid">
        <div class="card">Course 1</div>
        <div class="card">Course 2</div>
        <div class="card">Course 3</div>
        <div class="card">Course 4</div>
        <div class="card">Course 5</div>
        <div class="card">Course 6</div>
      </div>
    </section>

    <section id="gallery">
      <h2>Gallery</h2>
      <div class="gallery-grid">
        <div class="card big-1">1 (Big)</div>
        <div class="card">2</div>
        <div class="card big-2">3 (Big)</div>
        <div class="card">4</div>
        <div class="card">5</div>
        <div class="card">6</div>
        <div class="card">7</div>
        <div class="card">8</div>
      </div>
    </section>

    <footer>
      <div class="footer-col f-about">Col 1: About</div>
      <div class="footer-col f-links">Col 2: Links</div>
      <div class="footer-col f-services">Col 3: Services</div>
      <div class="footer-col f-contact">Col 4: Contact</div>
    </footer>
  </body>
</html>
