<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Flexbox vs Grid</title>
    <link rel="stylesheet" href="style5.css" />
  </head>
  <body>
    <h2>1. Сітка карток</h2>

    <p>CSS Grid:</p>
    <div class="grid-cards">
      <div class="card grid-bg">Card 1</div>
      <div class="card grid-bg">Card 2</div>
      <div class="card grid-bg">Card 3</div>
    </div>

    <p>Flexbox:</p>
    <div class="flex-cards">
      <div class="card flex-bg">Card 1</div>
      <div class="card flex-bg">Card 2</div>
      <div class="card flex-bg">Card 3</div>
    </div>

    <h2>2. Центрування</h2>

    <p>CSS Grid:</p>
    <div class="grid-center">
      <div class="card grid-bg">Grid Center</div>
    </div>

    <p>Flexbox:</p>
    <div class="flex-center">
      <div class="card flex-bg">Flex Center</div>
    </div>
  </body>
</html>
